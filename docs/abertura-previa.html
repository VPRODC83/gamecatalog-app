<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia da abertura</title>
<style>
  :root { --brand:#4A3FB0; --brand-deep:#2E2680; --card:#F6F7F9; --screen:#1D2027; --glow:#8F84FF; --pin:#C9CDD5; --page:#E6E8EC; --ink:#1D2027; --muted:#5D6472; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#14161B; --ink:#E8EAF0; --muted:#9AA1B0; } }
  :root[data-theme="dark"] { --page:#14161B; --ink:#E8EAF0; --muted:#9AA1B0; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px 16px; }
  .phone { width:min(320px,100%); aspect-ratio:9/19.5; border-radius:40px; padding:10px; background:#0c0d10; box-shadow:0 20px 50px rgba(0,0,0,.35); }
  .screen { position:relative; width:100%; height:100%; border-radius:31px; overflow:hidden;
            background:radial-gradient(120% 80% at 50% 38%, #5a4fd0 0%, var(--brand) 45%, var(--brand-deep) 100%); color:#fff; }
  .center { position:absolute; inset:0 0 22% 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; }
  .logo { width:42%; opacity:0; transform:translateY(-60px) scale(.6); }
  .logo .lcd { fill:var(--screen); }
  .logo .lcd-on { fill:var(--glow); opacity:0; }
  .logo .pin { fill:var(--pin); }
  .title { font-size:clamp(22px,7vw,30px); font-weight:800; letter-spacing:.5px; display:flex; }
  .title span { opacity:0; transform:translateY(12px); display:inline-block; white-space:pre; }
  .head { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ver { font-size:12px; color:#d9d5ff; letter-spacing:1px; opacity:0; }
  .play .ver { animation: fade .4s ease-out 2.6s forwards; }
  .tag { font-size:13px; opacity:0; color:#d9d5ff; letter-spacing:.3px; }
  .foot { position:absolute; left:0; right:0; bottom:7%; text-align:center; font-size:12px; line-height:1.6; opacity:0; color:#d9d5ff; }
  .foot b { color:#fff; font-size:13px; letter-spacing:1px; }
  .bar { position:absolute; left:30%; right:30%; bottom:4%; height:3px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; opacity:0; }
  .bar i { display:block; height:100%; width:0; background:#fff; }

  .play .logo { animation: drop .8s cubic-bezier(.2,1.5,.4,1) .2s forwards; }
  .play .lcd-on { animation: power .5s ease-out 1.1s forwards; }
  .play .title span { animation: up .3s ease-out forwards; animation-delay: calc(1.7s + var(--i) * 60ms); }
  .play .tag { animation: fade .4s ease-out 2.9s forwards; }
  .play .foot { animation: fade .4s ease-out 3.2s forwards; }
  .play .bar { animation: fade .2s ease-out 3.3s forwards; }
  .play .bar i { animation: load 1.6s ease-in-out 3.4s forwards; }
  @keyframes drop { to { opacity:1; transform:none; } }
  @keyframes power { 0%{opacity:0} 40%{opacity:1} 55%{opacity:.4} 100%{opacity:1} }
  @keyframes up { to { opacity:1; transform:none; } }
  @keyframes fade { to { opacity:1; } }
  @keyframes load { to { width:100%; } }
  @media (prefers-reduced-motion: reduce) { .play * { animation-duration:.01s !important; animation-delay:0s !important; } }

  button { font:inherit; padding:10px 18px; border-radius:999px; border:1px solid var(--muted); background:transparent; color:var(--ink); cursor:pointer; }
  p.note { max-width:340px; text-align:center; color:var(--muted); font-size:13px; margin:0; }
</style>
</head>
<body>
  <div class="phone"><div class="screen" id="s">
    <div class="center">
      <svg class="logo" viewBox="0 0 120 150" aria-label="Logo Game Catalog">
        <rect x="6" y="4" width="108" height="142" rx="16" fill="#F6F7F9"/>
        <rect x="24" y="22" width="72" height="58" rx="4" class="lcd"/>
        <rect x="32" y="30" width="56" height="42" rx="2" class="lcd-on"/>
        <g class="pin"><rect x="26" y="104" width="10" height="26" rx="1"/><rect x="41" y="104" width="10" height="26" rx="1"/><rect x="56" y="104" width="10" height="26" rx="1"/><rect x="71" y="104" width="10" height="26" rx="1"/><rect x="86" y="104" width="10" height="26" rx="1"/></g>
      </svg>
      <div class="head"><div class="title" id="t"></div><div class="ver">versão 0.5.2</div></div>
      <div class="tag">Sua coleção de videogames</div>
    </div>
    <div class="foot"><b>VPRODC83</b><br>Claude Opus 5.5<br>© 2026 VPRODC83. Todos os direitos reservados.</div>
    <div class="bar"><i></i></div>
  </div></div>
  <button onclick="play()">Ver de novo</button>
  <p class="note">Prévia da tela de abertura (5 segundos), com som. O navegador só toca o som depois de um toque: use "Ver de novo". No app, a versão mostrada é sempre a instalada.</p>
<script>
  const t = document.getElementById('t');
  [...'Game Catalog'].forEach((c, i) => { const s = document.createElement('span'); s.textContent = c; s.style.setProperty('--i', i); t.appendChild(s); });
  // som original do Game Catalog: três notas suaves subindo, com um brilho no fim
  let ac, timer;
  function chime() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const t0 = ac.currentTime + 0.02;
      [[523.25, 0], [659.25, 0.11], [987.77, 0.22]].forEach(([f, d], i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(0.22, t0 + d + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + (i === 2 ? 1.1 : 0.35));
        o.connect(g).connect(ac.destination); o.start(t0 + d); o.stop(t0 + d + 1.2);
      });
    } catch (e) {}
  }
  function play() {
    const s = document.getElementById('s'); s.classList.remove('play'); void s.offsetWidth; s.classList.add('play');
    clearTimeout(timer); timer = setTimeout(chime, 1100); // quando a tela do cartucho liga
  }
  play();
</script>
</body>
</html>
