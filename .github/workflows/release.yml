# Publica uma versão do aplicativo Android: monta e assina o APK, gera o atestado de proveniência e cria a release.
#
# Automático: todo push do dono no main que mude android/ ou tools/ vira uma versão nova.
# As marcas abaixo valem no TÍTULO do commit (primeira linha da mensagem).
#   - número: a última versão + 1 no último dígito (v0.2.0 → v0.2.1);
#   - "[minor]" na mensagem do commit sobe o do meio (v0.2.1 → v0.3.0);
#   - "[major]" sobe o primeiro (v0.3.0 → v1.0.0);
#   - "[sem versao]" na mensagem não publica nada.
# Manual: criar a tag v* (pela tela de Releases ou pelo git) também publica.
#
# O atestado prova que o gamecatalog.apk saiu DESTE arquivo, neste repositório.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ["android/**", "tools/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      nivel:
        description: "Qual parte do número aumentar"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write      # criar a tag e a release
  id-token: write      # assinar o atestado (Sigstore)
  attestations: write  # gravar o atestado no GitHub

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # trava extra: só o repositório oficial e só ações do dono
    if: github.repository == 'VPRODC83/gamecatalog-app' && github.actor == 'VPRODC83'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # precisa do histórico e das tags para numerar a versão

      - name: Escolher o número da versão
        id: v
        env:
          NIVEL: ${{ inputs.nivel }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"; echo "auto=nao" >> "$GITHUB_OUTPUT"; exit 0
          fi
          msg="$(git log -1 --pretty=%s)"   # as marcas valem só no título do commit (primeira linha)
          if printf '%s' "$msg" | grep -qiE '\[sem vers(ao|ão)\]|\[skip release\]'; then
            echo "pular=sim" >> "$GITHUB_OUTPUT"; echo "Commit marcado com [sem versao]: nada a publicar." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            echo "pular=sim" >> "$GITHUB_OUTPUT"; echo "Este commit já tem versão." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          last="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)"; last="${last:-v0.0.0}"
          IFS=. read -r ma mi pa <<< "${last#v}"
          nivel="${NIVEL:-patch}"
          printf '%s' "$msg" | grep -qi '\[minor\]' && nivel=minor
          printf '%s' "$msg" | grep -qi '\[major\]' && nivel=major
          case "$nivel" in
            major) ma=$((ma + 1)); mi=0; pa=0 ;;
            minor) mi=$((mi + 1)); pa=0 ;;
            *)     pa=$((pa + 1)) ;;
          esac
          tag="v${ma}.${mi}.${pa}"
          {
            echo "tag=$tag"; echo "auto=sim"; echo "anterior=$last"
          } >> "$GITHUB_OUTPUT"
          echo "Versão anterior: $last → nova: $tag ($nivel)"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.v.outputs.pular != 'sim'
        with:
          python-version: "3.12"

      - name: Baixar a lista de nomes das capas (libretro-thumbnails)
        if: steps.v.outputs.pular != 'sim'
        run: python tools/build_libretro.py "$RUNNER_TEMP/libretro"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.v.outputs.pular != 'sim'
        with:
          distribution: temurin
          java-version: "17"

      - name: Montar o aplicativo Android (APK assinado)
        id: apk
        if: steps.v.outputs.pular != 'sim'
        env:
          TAG: ${{ steps.v.outputs.tag }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "❌ Segredo ANDROID_KEY_PASSWORD não cadastrado: sem ele não dá para assinar o APK." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          python tools/build_catalog.py "$RUNNER_TEMP/libretro" android/app/src/main/assets/catalog.json.gz
          ks="$RUNNER_TEMP/release.keystore"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/app/release.keystore.enc -out "$ks" -pass env:ANDROID_KEY_PASSWORD
          cd android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          ANDROID_KEYSTORE_FILE="$ks" APP_VERSION="${TAG#v}" ./gradlew --no-daemon testDebugUnitTest --tests 'io.github.vprodc83.gamecatalog.CoreTest' assembleRelease
          rm -f "$ks"
          cp app/build/outputs/apk/release/app-release.apk ../gamecatalog.apk
          cd ..
          sha256sum gamecatalog.apk > gamecatalog.apk.sha256

      - name: Atestado de proveniência (prova que o APK saiu deste workflow)
        if: steps.v.outputs.pular != 'sim'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: gamecatalog.apk

      - name: Criar ou atualizar a release
        if: steps.v.outputs.pular != 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          ANTERIOR: ${{ steps.v.outputs.anterior }}
        run: |
          set -euo pipefail
          files="gamecatalog.apk gamecatalog.apk.sha256"
          if [ -n "${ANTERIOR:-}" ] && git rev-parse -q --verify "refs/tags/$ANTERIOR" >/dev/null; then range="$ANTERIOR..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
          mudancas="$(git log --no-merges --pretty='- %s' "$range" | head -40)"
          notes="$(printf 'Versão %s do Game Catalog.\n\nMudanças:\n%s\n\nCelular Android: baixe o gamecatalog.apk abaixo e abra para instalar, ou atualize pelo app em Ajustes → Procurar atualização.' "$TAG" "$mudancas")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" $files --title "$TAG" --notes "$notes" --verify-tag
          else
            # cria a tag no commit atual junto com a release
            gh release create "$TAG" $files --title "$TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi
          echo "## ✅ Versão $TAG publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "O app mostra a versão nova em Ajustes → Procurar atualização." >> "$GITHUB_STEP_SUMMARY"
